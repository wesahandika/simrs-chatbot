<!-- // INI BISA KIRIM TEXT, GAMBAR, VOICE NOTE + QUICK CHIPS + TYPING INDICATOR + TYPEWRITER EFFECT -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMRS Virtual Assistant - Inggit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 450px;
      max-width: 95%;
      height: 620px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background-color: #007bf5;
      color: white;
      padding: 16px;
      text-align: center;
    }
    .chat-header h2 { font-size: 1.2rem; }
    .chat-header p { font-size: 0.8rem; opacity: 0.9; }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bot {
      background-color: #f0f4f9;
      color: #1f1f1f;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .user {
      background-color: #007bf5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    /* QUICK ACTION CHIPS */
    .quick-chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chip-btn {
      background: #e8f2ff;
      color: #007bf5;
      border: 1px solid #b8d7ff;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip-btn:hover {
      background: #007bf5;
      color: #ffffff;
      border-color: #007bf5;
    }

    /* TYPING INDICATOR */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      min-height: 38px;
    }
    .typing-indicator span {
      width: 7px;
      height: 7px;
      background-color: #8898aa;
      border-radius: 50%;
      display: inline-block;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-area {
      display: flex;
      align-items: center;
      padding: 12px;
      border-top: 1px solid #e0e0e0;
      background: #fff;
      gap: 8px;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .icon-btn {
      cursor: pointer;
      padding: 8px 10px;
      background: #f0f4f9;
      border-radius: 6px;
      font-size: 1.1rem;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: #e0e8f5; }
    .recording { background-color: #ff4d4d !important; color: white; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .input-area button.send-btn {
      padding: 10px 16px;
      background-color: #007bf5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .input-area button.send-btn:hover { background-color: #005bb5; }
    #filePreview {
      font-size: 0.75rem;
      color: #007bf5;
      padding: 4px 16px;
      background: #f0f4f9;
      display: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>🏥 Inggit - SIMRS Virtual Assistant</h2>
      <p>Layanan Informasi & Pendaftaran Rumah Sakit</p>
    </div>

    <div class="chat-box" id="chatBox">
      <!-- PESAN SAMBUTAN AWAL -->
      <div class="message bot">
        Halo! Saya <b>Inggit</b>, Asisten Virtual resmi Rumah Sakit. Ada yang bisa saya bantu? Anda bisa mengetik pertanyaan, mengunggah foto berkas/rujukan, merekam pesan suara, atau memilih topik di bawah ini:
        
        <div class="quick-chips-wrapper">
          <button type="button" class="chip-btn" onclick="sendQuickMessage('Syarat pendaftaran pasien BPJS')">📋 Syarat BPJS</button>
          <button type="button" class="chip-btn" onclick="sendQuickMessage('Jadwal dan jam operasional poliklinik')">⏰ Jadwal Poli</button>
          <button type="button" class="chip-btn" onclick="sendQuickMessage('Cara daftar antrean online')">📱 Antrean Online</button>
          <button type="button" class="chip-btn" onclick="sendQuickMessage('Persiapan tes laboratorium darah')">🧪 Persiapan Lab</button>
        </div>
      </div>
    </div>

    <div id="filePreview"></div>

    <div class="input-area">
      <label class="icon-btn" title="Unggah Foto / Berkas">
        📎
        <input type="file" id="fileInput" accept="image/*,audio/*" style="display:none" onchange="handleFileSelect()">
      </label>

      <button class="icon-btn" id="recordBtn" onclick="toggleRecording()" title="Rekam Suara">🎙️</button>

      <input type="text" id="userInput" placeholder="Ketik pertanyaan Anda..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    let selectedFile = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function handleFileSelect() {
      const fileInput = document.getElementById('fileInput');
      const preview = document.getElementById('filePreview');
      if (fileInput.files.length > 0) {
        selectedFile = fileInput.files[0];
        preview.innerText = `📎 Terpilih: ${selectedFile.name}`;
        preview.style.display = 'block';
      }
    }

    async function toggleRecording() {
      const recordBtn = document.getElementById('recordBtn');
      const preview = document.getElementById('filePreview');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
              audioChunks.push(e.data);
            }
          };

          mediaRecorder.onstop = () => {
            let rawType = mediaRecorder.mimeType || 'audio/webm';
            let cleanMimeType = rawType.split(';')[0];
            const audioBlob = new Blob(audioChunks, { type: cleanMimeType });
            
            selectedFile = new File([audioBlob], 'voice-note.webm', { type: cleanMimeType });
            preview.innerText = `🎙️ Voice Note siap dikirim (${(audioBlob.size / 1024).toFixed(1)} KB)`;
            preview.style.display = 'block';

            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start(100);
          isRecording = true;
          recordBtn.classList.add('recording');
          recordBtn.innerText = '⏹️';
        } catch (err) {
          alert('Gagal mengakses mikrofon browser.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.innerText = '🎙️';
      }
    }

    function sendQuickMessage(text) {
      document.getElementById('userInput').value = text;
      sendMessage();
    }

    // Helper format markdown dasar ke HTML
    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>');
    }

    // Efek mengetik berjalan karakter demi karakter
    function typeWriterEffect(rawText, callback) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      chatBox.appendChild(msgDiv);

      let index = 0;
      const speed = 12; // Kecepatan ketik (milidetik per karakter)

      function writeChar() {
        if (index < rawText.length) {
          index++;
          const currentText = rawText.substring(0, index);
          msgDiv.innerHTML = formatMarkdown(currentText);
          chatBox.scrollTop = chatBox.scrollHeight;
          setTimeout(writeChar, speed);
        } else {
          msgDiv.innerHTML = formatMarkdown(rawText);
          if (callback) callback();
        }
      }

      writeChar();
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatBox = document.getElementById('chatBox');
      const preview = document.getElementById('filePreview');

      const text = inputEl.value.trim();
      const fileToSend = selectedFile;

      if (!text && !fileToSend) return;

      let userDisplayMsg = text;
      if (fileToSend) {
        userDisplayMsg += text ? `\n[File: ${fileToSend.name}]` : `[Mengirim File: ${fileToSend.name}]`;
      }

      appendMessage(userDisplayMsg, 'user');

      const formData = new FormData();
      if (text) formData.append('message', text);
      if (fileToSend) formData.append('file', fileToSend);

      // Reset Form Input & Disable Button saat memproses
      inputEl.value = '';
      selectedFile = null;
      document.getElementById('fileInput').value = '';
      preview.style.display = 'none';
      sendBtn.disabled = true;

      // Tampilkan Animasi Indikator 3 Titik
      const typingEl = document.createElement('div');
      typingEl.className = 'message bot typing-indicator';
      typingEl.innerHTML = '<span></span><span></span><span></span>';
      chatBox.appendChild(typingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (chatBox.contains(typingEl)) {
          chatBox.removeChild(typingEl);
        }

        if (data && data.reply) {
          // Panggil efek teks berjalan
          typeWriterEffect(data.reply, () => {
            sendBtn.disabled = false;
          });
        } else {
          appendMessage('Maaf, antrean sedang padat. Silakan tanyakan ulang ya!', 'bot');
          sendBtn.disabled = false;
        }
      } catch (err) {
        if (chatBox.contains(typingEl)) {
          chatBox.removeChild(typingEl);
        }
        appendMessage('Maaf, gagal terhubung ke server.', 'bot');
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = formatMarkdown(text);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendMessage();
    }
  </script>

</body>
</html>
