<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMRS Virtual Assistant - Inggit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 450px;
      max-width: 95%;
      height: 600px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background-color: #007bf5;
      color: white;
      padding: 16px;
      text-align: center;
    }
    .chat-header h2 {
      font-size: 1.2rem;
    }
    .chat-header p {
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bot {
      background-color: #f0f4f9;
      color: #1f1f1f;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .user {
      background-color: #007bf5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e0e0e0;
      background: #fff;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .input-area button {
      margin-left: 8px;
      padding: 10px 16px;
      background-color: #007bf5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .input-area button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>🏥 Inggit - SIMRS Virtual Assistant</h2>
      <p>Layanan Informasi & Pendaftaran Rumah Sakit</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Halo! Saya <b>Inggit</b>, Asisten Virtual resmi Rumah Sakit. Ada yang bisa saya bantu terkait jadwal dokter, antrean BPJS/Umum, atau jam operasional?
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ketik pertanyaan Anda di sini..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = inputEl.value.trim();

      if (!text) return;

      // Tampilkan pesan pengguna di chat UI
      appendMessage(text, 'user');
      inputEl.value = '';

      // Tampilkan indikator loading sederhana
      const loadingEl = document.createElement('div');
      loadingEl.className = 'message bot';
      loadingEl.innerText = 'Inggit sedang mengetik...';
      chatBox.appendChild(loadingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        chatBox.removeChild(loadingEl);

        if (data.reply) {
          appendMessage(data.reply, 'bot');
        } else {
          appendMessage('Maaf, terjadi masalah saat memproses tanggapan.', 'bot');
        }
      } catch (err) {
        chatBox.removeChild(loadingEl);
        appendMessage('Maaf, gagal terhubung ke server.', 'bot');
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
