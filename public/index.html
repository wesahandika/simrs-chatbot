<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>🏥 Inggit - SIMRS Virtual Assistant</h2>
      <p>Layanan Informasi & Pendaftaran Rumah Sakit</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Halo! Saya <b>Inggit</b>, Asisten Virtual resmi Rumah Sakit. Ada yang bisa saya bantu? Anda bisa mengetik pertanyaan, mengunggah foto berkas/rujukan, atau merekam pesan suara!
      </div>
    </div>

    <div id="filePreview"></div>

    <div class="input-area">
      <label class="icon-btn" title="Unggah Foto / Berkas">
        📎
        <input type="file" id="fileInput" accept="image/*,audio/*" style="display:none" onchange="handleFileSelect()">
      </label>

      <button class="icon-btn" id="recordBtn" onclick="toggleRecording()" title="Rekam Suara">🎙️</button>

      <input type="text" id="userInput" placeholder="Ketik pertanyaan Anda..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    let selectedFile = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function handleFileSelect() {
      const fileInput = document.getElementById('fileInput');
      const preview = document.getElementById('filePreview');
      if (fileInput.files.length > 0) {
        selectedFile = fileInput.files[0];
        preview.innerText = `📎 Terpilih: ${selectedFile.name}`;
        preview.style.display = 'block';
      }
    }

    async function toggleRecording() {
      const recordBtn = document.getElementById('recordBtn');
      const preview = document.getElementById('filePreview');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            selectedFile = new File([audioBlob], 'voice-note.mp3', { type: 'audio/mp3' });
            preview.innerText = `🎙️ Voice Note siap dikirim`;
            preview.style.display = 'block';
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.classList.add('recording');
          recordBtn.innerText = '⏹️';
        } catch (err) {
          alert('Gagal mengakses mikrofon browser.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.innerText = '🎙️';
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const preview = document.getElementById('filePreview');

      const text = inputEl.value.trim();
      const fileToSend = selectedFile;

      if (!text && !fileToSend) return;

      let userDisplayMsg = text;
      if (fileToSend) {
        userDisplayMsg += text ? `\n[File: ${fileToSend.name}]` : `[Mengirim File: ${fileToSend.name}]`;
      }

      appendMessage(userDisplayMsg, 'user');

      const formData = new FormData();
      if (text) formData.append('message', text);
      if (fileToSend) formData.append('file', fileToSend);

      // Reset Input
      inputEl.value = '';
      selectedFile = null;
      document.getElementById('fileInput').value = '';
      preview.style.display = 'none';

      // Indikator loading animasi titik bergerak
      const loadingEl = document.createElement('div');
      loadingEl.className = 'message bot';
      chatBox.appendChild(loadingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      let dotCount = 0;
      loadingEl.innerText = 'Inggit sedang memproses';
      const intervalId = setInterval(() => {
        dotCount = (dotCount % 3) + 1;
        loadingEl.innerText = 'Inggit sedang memproses' + '.'.repeat(dotCount);
      }, 400);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        
        clearInterval(intervalId);
        chatBox.removeChild(loadingEl);

        if (data.reply) {
          appendMessage(data.reply, 'bot');
        } else {
          appendMessage('Maaf, terjadi masalah saat memproses tanggapan.', 'bot');
        }
      } catch (err) {
        clearInterval(intervalId);
        chatBox.removeChild(loadingEl);
        appendMessage('Maaf, gagal terhubung ke server.', 'bot');
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
